[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtrack"
version = "0.1.0"
description = "Oblique video -> top-down movement data (EPSG:27700) for architecture research"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python>=4.9",
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]
# PyTorch is installed separately so you get the right build for your machine (see README).

[project.optional-dependencies]
dev = ["pytest>=7", "pyogrio>=0.7", "ruff"]

[project.scripts]
groundtrack = "groundtrack.cli:main"

[tool.setuptools]
packages = ["groundtrack"]

[tool.setuptools.package-data]
groundtrack = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs YOLO on a generated sample video (slower)"]
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio"]
