# groundtrack site config: plaza
# Paths are relative to this file. Run `groundtrack calibrate --config sites/plaza.yaml` first.
site: plaza
video: ../footage/plaza.mp4
geotiff: ../maps/plaza.tif              # north-up GeoTIFF in EPSG:27700 (QGIS / Digimap export)
homography: ../calibration/plaza_homography.json
lens: null                                # ../calibration/phone_1x_lens.json (optional)
output_dir: ../runs
models_dir: ../models                     # YOLO weights are downloaded here on first use
device: auto                             # auto | cuda | mps | cpu
fps: null                                 # set only if the video reports a wrong frame rate

detection:
  model: yolo26m.pt         # yolo26n/s/m/l/x: bigger = better on small far people, slower
  imgsz: 1280               # raise to 1600-1920 for distant people in 4K footage
  conf: 0.25
  tracker: botsort          # bytetrack | botsort | path/to/custom.yaml
  track_buffer_s: 1.5       # people get occluded by each other for longer than cars
  vid_stride: 1
  roi: null                 # run `groundtrack roi --config sites/plaza.yaml` to draw one
  record_predicted: true
  suppress_riders: true
  stabilize: true           # compensate camera movement (see README)

groups:
  people:
    classes: [person]
    speed_range: [0.0, 2.5]
    max_speed: 6.0
    smooth_window_s: 1.0
  cycles:
    classes: [bicycle]
    speed_range: [0.0, 10.0]
    max_speed: 20.0
    smooth_window_s: 0.8

cleaning:
  min_track_s: 2.0
  max_gap_s: 2.0

grid:
  cell_size_m: 1.0
  include_predicted: false

field:                      # smoothed vector field for Houdini particle sims
  cell_size_m: 0.5
  smooth_m: 1.5
  time_window_s: null       # e.g. 10 for a field per 10 s (animated)

stats:
  histogram_bins: 25
  count_lines: []           # e.g. - {name: north_entrance, a: [530120.0, 180340.0], b: [530128.0, 180336.0]}

visuals:
  extent: data              # data | geotiff
  margin_m: 8.0
  line_width: 1.0

debug_video:
  enabled: false
  blur_people: true
